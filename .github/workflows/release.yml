name: Build desktop apps

# Builds the Windows and macOS installers.
#  - on every pull request / push to main: build + tests, installers kept as artifacts
#  - on a tag like v3.0.0: installers attached to the GitHub Release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
        env: { ELECTRON_SKIP_BINARY_DOWNLOAD: '1' }
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      # The two Mac disk images are built one after the other: in parallel
      # they fight over the same mounted volume and hdiutil fails.
      - name: Build installers (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          npx electron-builder --mac --arm64 --publish never
          npx electron-builder --mac --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Build installers (Windows)
        if: matrix.os == 'windows-latest'
        run: npx electron-builder --win --publish never
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.exe
          if-no-files-found: error
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.dmg
            release/*.exe
